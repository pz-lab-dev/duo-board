<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Duo·Board</title>
<meta name="theme-color" content="#2D5BE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duo·Board">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =====================================================================
// 🔥 FIREBASE CONFIG — HIER DEINE EIGENEN WERTE EINFÜGEN
// =====================================================================
const firebaseConfig = {
  apiKey:            "AIzaSyAf6lHwL1ffEcKYtwkdO5tQnS56yU5N0PY",
  authDomain:        "duo-board-a86c3.firebaseapp.com",
  projectId:         "duo-board-a86c3",
  storageBucket:     "duo-board-a86c3.firebasestorage.app",
  messagingSenderId: "78828458509",
  appId:             "1:78828458509:web:7c881b5c73e2a3ac79fb44"
};
// =====================================================================

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── Globale Zustände ──────────────────────────────────────────────────
let currentUser = null;
let unsubTodos = null;
let unsubInvs  = null;
let currentTodoFilter = 'open';
let currentInvFilter  = 'all';
let currentPersonFilter = '';
let dragSrcId = null;

const COLORS = [
  {id:'blue',hex:'#3B82F6',label:'Blau'},
  {id:'green',hex:'#22C55E',label:'Grün'},
  {id:'yellow',hex:'#F59E0B',label:'Gelb'},
  {id:'red',hex:'#EF4444',label:'Rot'},
  {id:'purple',hex:'#A855F7',label:'Violett'},
  {id:'gray',hex:'#9CA3AF',label:'Grau'},
  {id:'orange',hex:'#F97316',label:'Orange'},
  {id:'pink',hex:'#EC4899',label:'Pink'},
];

// ── Auth State ────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    showApp();
    startListeners();
  } else {
    currentUser = null;
    stopListeners();
    showLogin();
  }
});

// ── Login ─────────────────────────────────────────────────────────────
window.doLogin = async () => {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const err   = document.getElementById('l-error');
  err.textContent = '';
  document.getElementById('l-btn').textContent = 'Anmelden…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = 'E-Mail oder Passwort falsch.';
    document.getElementById('l-btn').textContent = 'Anmelden';
  }
};

window.doLogout = async () => {
  await signOut(auth);
};

// ── Realtime Listeners ─────────────────────────────────────────────────
function startListeners() {
  // Todos — ordered by 'order' field, fallback createdAt
  const qTodos = query(collection(db,'todos'), orderBy('order','asc'));
  unsubTodos = onSnapshot(qTodos, snap => {
    window._todos = snap.docs.map(d => ({id:d.id,...d.data()}));
    renderTodos();
    renderStats();
  });

  const qInvs = query(collection(db,'investments'), orderBy('createdAt','desc'));
  unsubInvs = onSnapshot(qInvs, snap => {
    window._investments = snap.docs.map(d => ({id:d.id,...d.data()}));
    renderInvestments();
    renderStats();
  });
}

function stopListeners() {
  if (unsubTodos) { unsubTodos(); unsubTodos = null; }
  if (unsubInvs)  { unsubInvs();  unsubInvs  = null; }
  window._todos = [];
  window._investments = [];
}

// ── UI Show/Hide ──────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display   = 'none';
}
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display   = 'flex';
  const email = currentUser?.email || '';
  document.getElementById('user-label').textContent = email;
  // Approval-Key bestimmen: erster registrierter User = user1, zweiter = user2
  // Wir nutzen die E-Mail-Adresse als stabilen Identifier
  const stored = localStorage.getItem('approvalMap') ? JSON.parse(localStorage.getItem('approvalMap')) : {};
  if (!stored[email]) {
    const keys = Object.values(stored);
    stored[email] = keys.includes('user1') ? 'user2' : 'user1';
    localStorage.setItem('approvalMap', JSON.stringify(stored));
  }
  localStorage.setItem('myApprovalKey', stored[email]);
}

// ── Page Nav ──────────────────────────────────────────────────────────
window.showPage = id => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
};

// ── Dark Mode ─────────────────────────────────────────────────────────
window.toggleDark = () => {
  const on = document.documentElement.dataset.dark === 'true';
  document.documentElement.dataset.dark = !on;
  document.getElementById('dark-icon').textContent = on ? '🌙' : '☀️';
  localStorage.setItem('dark', !on);
};
if (localStorage.getItem('dark') === 'true') {
  document.documentElement.dataset.dark = 'true';
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('dark-icon');
    if (el) el.textContent = '☀️';
  });
}

// ── Toast ─────────────────────────────────────────────────────────────
window.toast = (msg, type='') => {
  const el = document.createElement('div');
  el.className = 'toast';
  if (type==='error')   el.style.background='var(--danger)';
  if (type==='success') el.style.background='var(--success)';
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(), 3000);
};

// ── Confirm ───────────────────────────────────────────────────────────
window._confirmCb = null;
window.openConfirm = (title, msg, cb) => {
  document.getElementById('cf-title').textContent = title;
  document.getElementById('cf-msg').textContent   = msg;
  window._confirmCb = cb;
  document.getElementById('cf-overlay').classList.add('open');
};
window.closeConfirm = () => document.getElementById('cf-overlay').classList.remove('open');
window.doConfirm    = () => { closeConfirm(); window._confirmCb && window._confirmCb(); };

// ── Utility ───────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function colorHex(id) { return COLORS.find(c=>c.id===id)?.hex||'#9CA3AF'; }
function isOverdue(t) {
  if (!t.dueDate||t.done) return false;
  return new Date(t.dueDate) < new Date(new Date().toDateString());
}
function daysUntil(d) {
  if (!d) return null;
  return Math.ceil((new Date(d)-new Date(new Date().toDateString()))/86400000);
}
function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function getUserLabel() {
  const e = currentUser?.email||'';
  return e.split('@')[0];
}

// ── TODOS ─────────────────────────────────────────────────────────────
window.quickAdd = async () => {
  const inp = document.getElementById('qa-input');
  const title = inp.value.trim();
  if (!title) return;
  const todos = window._todos||[];
  const maxOrder = todos.reduce((m,t)=>Math.max(m,t.order||0),0);
  await addDoc(collection(db,'todos'), {
    title, description:'', person:'', dueDate:'', color:'',
    priority:'medium', done:false, subtasks:[], comments:[],
    order: maxOrder+1,
    createdBy: getUserLabel(),
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
  });
  inp.value='';
  toast('Aufgabe hinzugefügt ✓','success');
};

window.setFilter = (f, btn) => {
  currentTodoFilter = f;
  currentPersonFilter = '';
  document.querySelectorAll('#todo-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#person-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTodos();
};

window.setPersonFilter = (name, btn) => {
  if (currentPersonFilter===name) { currentPersonFilter=''; btn.classList.remove('active'); }
  else { currentPersonFilter=name; document.querySelectorAll('#person-filters .filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  renderTodos();
};

window.setInvFilter = (f, btn) => {
  currentInvFilter = f;
  document.querySelectorAll('#inv-filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderInvestments();
};

function getFilteredTodos() {
  const q = (document.getElementById('todo-search')?.value||'').toLowerCase();
  let list = [...(window._todos||[])];
  if (q) list = list.filter(t=>t.title.toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q));
  if (currentPersonFilter) list = list.filter(t=>t.person===currentPersonFilter);
  switch(currentTodoFilter) {
    case 'open':     list = list.filter(t=>!t.done); break;
    case 'done':     list = list.filter(t=>t.done); break;
    case 'overdue':  list = list.filter(t=>isOverdue(t)); break;
    case 'newest':   list.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); break;
    case 'duedate':  list = list.filter(t=>!t.done).sort((a,b)=>(a.dueDate||'9999')>(b.dueDate||'9999')?1:-1); break;
    case 'priority': { const p={high:0,medium:1,low:2}; list=list.filter(t=>!t.done).sort((a,b)=>(p[a.priority]||1)-(p[b.priority]||1)); break; }
  }
  return list;
}

function renderPersonFilters() {
  const persons = [...new Set((window._todos||[]).map(t=>t.person).filter(Boolean))];
  document.getElementById('person-filters').innerHTML = persons.map(p=>`
    <button class="filter-btn ${currentPersonFilter===p?'active':''}" onclick="setPersonFilter('${p}',this)">👤 ${p}</button>`).join('');
}

function renderTodos() {
  renderPersonFilters();
  const list = getFilteredTodos();
  const container = document.getElementById('tasks-list');

  // Merken welche Karten offen sind
  const openIds = new Set();
  document.querySelectorAll('.task-card.expanded').forEach(c => openIds.add(c.dataset.id));

  if (!list.length) {
    container.innerHTML=`<div class="empty-state"><div class="big-icon">✅</div><p>Keine Aufgaben gefunden</p></div>`;
    return;
  }
  container.innerHTML = list.map(t=>taskCardHTML(t)).join('');

  // Offene Karten wiederherstellen
  openIds.forEach(id => {
    const card = document.getElementById('tc-'+id);
    if (card) card.classList.add('expanded');
  });

  container.querySelectorAll('.task-card').forEach(card=>{
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragover',  onDragOver);
    card.addEventListener('drop',      onDrop);
    card.addEventListener('dragend',   onDragEnd);
  });
}

function taskCardHTML(t) {
  const overdue   = isOverdue(t);
  const days      = daysUntil(t.dueDate);
  const chex      = t.color ? colorHex(t.color) : '#E5E7EB';
  const sdone     = (t.subtasks||[]).filter(s=>s.done).length;
  const stotal    = (t.subtasks||[]).length;
  const pClass    = {high:'p-high',medium:'p-medium',low:'p-low'}[t.priority]||'p-medium';
  let dueBadge='';
  if (!t.done&&t.dueDate) {
    if (overdue) dueBadge=`<span class="task-badge badge-overdue">⚠️ Überfällig</span>`;
    else if (days<=3) dueBadge=`<span class="task-badge badge-soon">📅 ${days===0?'Heute':days+'d'}</span>`;
    else dueBadge=`<span style="font-size:.78rem;color:var(--text3)">📅 ${fmtDate(t.dueDate)}</span>`;
  }
  const personBadge = t.person?`<span class="task-badge badge-person">👤 ${t.person}</span>`:'';
  const progressBar = stotal>0?`<div class="progress-bar" style="margin:0 16px 8px 20px"><div class="progress-fill" style="width:${Math.round(sdone/stotal*100)}%"></div></div>`:'';
  const colorSwatches = COLORS.map(c=>`<div class="color-swatch ${t.color===c.id?'selected':''}" style="background:${c.hex}" title="${c.label}" onclick="setTaskColor('${t.id}','${c.id}')"></div>`).join('');
  const subtaskItems = (t.subtasks||[]).map(s=>`
    <div class="subtask-item ${s.done?'done-sub':''}" id="sub-${s.id}">
      <input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${t.id}','${s.id}')">
      <input type="text" value="${(s.title||'').replace(/"/g,'&quot;')}" onblur="saveSubtask('${t.id}','${s.id}',this.value)">
      <button onclick="deleteSubtask('${t.id}','${s.id}')" style="color:var(--text3);font-size:.8rem;padding:2px">✕</button>
    </div>`).join('');
  const commentItems = (t.comments||[]).map(c=>`
    <div class="comment-item">
      <div class="comment-author">${c.author}</div>
      <div class="comment-text">${c.text}</div>
      <div class="comment-time">${c.time||''}</div>
    </div>`).join('');
  const changelog = (t.changelog||[]).slice(-3).reverse().map(l=>`<span>${l}</span>`).join('');
  return `
  <div class="task-card ${t.done?'done':''} ${overdue?'overdue overdue-h':''}" id="tc-${t.id}" draggable="true" data-id="${t.id}">
    <div class="color-strip" style="background:${chex}"></div>
    <div class="task-header" onclick="toggleExpand('${t.id}')">
      <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
      <button class="done-btn ${t.done?'done':''}" onclick="toggleDone('${t.id}');event.stopPropagation()">${t.done?'✓':''}</button>
      <span class="task-title">${t.title}</span>
      <div class="task-meta">
        <span class="priority-dot ${pClass}"></span>
        ${dueBadge}${personBadge}
        <span class="expand-icon">▶</span>
      </div>
    </div>
    ${progressBar}
    <div class="task-detail" id="td-${t.id}">
      <div class="detail-grid">
        <div class="field-group"><label>Titel</label><input type="text" value="${(t.title||'').replace(/"/g,'&quot;')}" onchange="updateTodoField('${t.id}','title',this.value)"></div>
        <div class="field-group"><label>Zuständig</label><input type="text" value="${t.person||''}" placeholder="Name eingeben" onchange="updateTodoField('${t.id}','person',this.value)"></div>
        <div class="field-group"><label>Fälligkeitsdatum</label><input type="date" value="${t.dueDate||''}" onchange="updateTodoField('${t.id}','dueDate',this.value)"></div>
        <div class="field-group"><label>Priorität</label>
          <select onchange="updateTodoField('${t.id}','priority',this.value)">
            <option value="low" ${t.priority==='low'?'selected':''}>🟢 Niedrig</option>
            <option value="medium" ${t.priority==='medium'?'selected':''}>🟡 Mittel</option>
            <option value="high" ${t.priority==='high'?'selected':''}>🔴 Hoch</option>
          </select></div>
        <div class="field-group" style="grid-column:1/-1"><label>Beschreibung</label><textarea onchange="updateTodoField('${t.id}','description',this.value)">${t.description||''}</textarea></div>
        <div class="field-group" style="grid-column:1/-1"><label>Farbe</label><div class="color-picker">${colorSwatches}</div></div>
      </div>
      <div class="subtasks-section">
        <h4>Unteraufgaben (${sdone}/${stotal})</h4>
        <div id="subtasks-${t.id}">${subtaskItems}</div>
        <div class="subtask-add">
          <input type="text" id="new-sub-${t.id}" placeholder="Neue Unteraufgabe..." onkeydown="if(event.key==='Enter')addSubtask('${t.id}')">
          <button class="btn-save" onclick="addSubtask('${t.id}')" style="padding:5px 10px;font-size:.8rem">＋</button>
        </div>
      </div>
      <div class="comments-section">
        <h4>Kommentare</h4>
        <div id="comments-${t.id}">${commentItems}</div>
        <div class="comment-add">
          <input type="text" id="ci-${t.id}" placeholder="Kommentar schreiben..." onkeydown="if(event.key==='Enter')addComment('${t.id}')">
          <button class="btn-save" onclick="addComment('${t.id}')" style="padding:7px 12px">✉</button>
        </div>
      </div>
      ${changelog?`<div class="changelog"><strong style="font-size:.76rem;color:var(--text3)">VERLAUF:</strong>${changelog}</div>`:''}
      <div class="detail-actions">
        <button class="btn-danger" onclick="deleteTask('${t.id}')">🗑️ Löschen</button>
        <span style="flex:1"></span>
        <span style="font-size:.75rem;color:var(--text3)">von ${t.createdBy||''}</span>
      </div>
    </div>
  </div>`;
}

window.toggleExpand = id => document.getElementById('tc-'+id)?.classList.toggle('expanded');

window.toggleDone = async id => {
  const t = (window._todos||[]).find(t=>t.id===id);
  if (!t) return;
  const newDone = !t.done;
  const cl = [...(t.changelog||[]), `${new Date().toLocaleString('de-CH')}: ${newDone?'Erledigt':'Wieder geöffnet'} von ${getUserLabel()}`];
  await updateDoc(doc(db,'todos',id),{done:newDone,changelog:cl,updatedAt:serverTimestamp()});
  toast(newDone?'✓ Erledigt!':'Wieder geöffnet','success');
};

window.updateTodoField = async (id, field, value) => {
  const t = (window._todos||[]).find(t=>t.id===id);
  if (!t) return;
  const cl = [...(t.changelog||[]), `${new Date().toLocaleString('de-CH')}: "${field}" geändert von ${getUserLabel()}`];
  await updateDoc(doc(db,'todos',id),{[field]:value,changelog:cl,updatedAt:serverTimestamp()});
};

window.setTaskColor = async (id, colorId) => {
  await updateDoc(doc(db,'todos',id),{color:colorId,updatedAt:serverTimestamp()});
};

window.addSubtask = async taskId => {
  const inp = document.getElementById('new-sub-'+taskId);
  const title = inp.value.trim();
  if (!title) return;
  const t = (window._todos||[]).find(t=>t.id===taskId);
  if (!t) return;
  const subs = [...(t.subtasks||[]), {id:uid(),title,done:false}];
  await updateDoc(doc(db,'todos',taskId),{subtasks:subs,updatedAt:serverTimestamp()});
  inp.value='';
};

window.toggleSubtask = async (taskId, subId) => {
  const t = (window._todos||[]).find(t=>t.id===taskId);
  if (!t) return;
  const subs = (t.subtasks||[]).map(s=>s.id===subId?{...s,done:!s.done}:s);
  await updateDoc(doc(db,'todos',taskId),{subtasks:subs,updatedAt:serverTimestamp()});
};

window.saveSubtask = async (taskId, subId, value) => {
  const t = (window._todos||[]).find(t=>t.id===taskId);
  if (!t) return;
  const subs = (t.subtasks||[]).map(s=>s.id===subId?{...s,title:value}:s);
  await updateDoc(doc(db,'todos',taskId),{subtasks:subs,updatedAt:serverTimestamp()});
};

window.deleteSubtask = async (taskId, subId) => {
  const t = (window._todos||[]).find(t=>t.id===taskId);
  if (!t) return;
  const subs = (t.subtasks||[]).filter(s=>s.id!==subId);
  await updateDoc(doc(db,'todos',taskId),{subtasks:subs,updatedAt:serverTimestamp()});
};

window.addComment = async taskId => {
  const inp = document.getElementById('ci-'+taskId);
  const text = inp.value.trim();
  if (!text) return;
  const t = (window._todos||[]).find(t=>t.id===taskId);
  if (!t) return;
  const comments = [...(t.comments||[]), {id:uid(),author:getUserLabel(),text,time:new Date().toLocaleString('de-CH')}];
  await updateDoc(doc(db,'todos',taskId),{comments,updatedAt:serverTimestamp()});
  inp.value='';
};

window.deleteTask = id => {
  openConfirm('Aufgabe löschen','Diese Aufgabe wirklich löschen?', async ()=>{
    await deleteDoc(doc(db,'todos',id));
    toast('Aufgabe gelöscht');
  });
};

// ── Drag & Drop ────────────────────────────────────────────────────────
function onDragStart(e) { dragSrcId=this.dataset.id; this.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onDragOver(e)  { e.preventDefault(); document.querySelectorAll('.task-card').forEach(c=>c.classList.remove('drag-over')); this.classList.add('drag-over'); }
async function onDrop(e) {
  e.preventDefault();
  const targetId = this.dataset.id;
  if (!dragSrcId||!targetId||dragSrcId===targetId) return;
  const todos = [...(window._todos||[])];
  const srcIdx = todos.findIndex(t=>t.id===dragSrcId);
  const tgtIdx = todos.findIndex(t=>t.id===targetId);
  const [item] = todos.splice(srcIdx,1);
  todos.splice(tgtIdx,0,item);
  // Update order fields in Firebase
  const updates = todos.map((t,i)=>updateDoc(doc(db,'todos',t.id),{order:i}));
  await Promise.all(updates);
}
function onDragEnd() { document.querySelectorAll('.task-card').forEach(c=>{c.classList.remove('dragging');c.classList.remove('drag-over');}); }

// ── Stats ─────────────────────────────────────────────────────────────
function renderStats() {
  const todos = window._todos||[];
  const invs  = window._investments||[];
  const open    = todos.filter(t=>!t.done).length;
  const done    = todos.filter(t=>t.done).length;
  const overdue = todos.filter(t=>isOverdue(t)).length;
  const high    = todos.filter(t=>!t.done&&t.priority==='high').length;
  document.getElementById('todo-stats').innerHTML=`
    <div class="stat-chip"><strong>${open}</strong> offen</div>
    <div class="stat-chip"><strong>${done}</strong> erledigt</div>
    ${overdue?`<div class="stat-chip" style="background:#FEE2E2;border-color:var(--danger);color:var(--danger)"><strong>${overdue}</strong> überfällig</div>`:''}
    ${high?`<div class="stat-chip accent"><strong>${high}</strong> hohe Priorität</div>`:''}`;

  const invTotal  = invs.length;
  const invAppr   = invs.filter(i=>i.status==='approved').length;
  const invSum    = invs.reduce((s,i)=>s+(parseFloat(i.price)||0),0);
  document.getElementById('inv-stats').innerHTML=`
    <div class="stat-chip"><strong>${invTotal}</strong> total</div>
    <div class="stat-chip accent"><strong>${invAppr}</strong> freigegeben</div>
    <div class="stat-chip"><strong>CHF ${invSum.toLocaleString('de-CH',{minimumFractionDigits:2})}</strong></div>`;
}

// ── INVESTMENTS ──────────────────────────────────────────────────────
window._modalInvId = null;

window.openAddInv = () => {
  window._modalInvId = null;
  document.getElementById('modal-title').textContent = 'Neue Investition';
  ['m-name','m-price','m-desc','m-link'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('m-person').value='';
  document.getElementById('m-priority').value='medium';
  document.getElementById('m-status').value='pending';
  document.getElementById('m-color').innerHTML=COLORS.map(c=>`<div class="color-swatch" style="background:${c.hex}" title="${c.label}" onclick="selectModalColor('${c.id}',this)"></div>`).join('');
  document.getElementById('modal-overlay').classList.add('open');
};

window.selectModalColor = (id,el) => {
  document.querySelectorAll('#m-color .color-swatch').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected'); el.dataset.colorId=id;
};

window.closeModal = e => {
  if (!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
};

window.saveInvestment = async () => {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { toast('Bitte Produktname eingeben','error'); return; }
  const colorEl = document.querySelector('#m-color .color-swatch.selected');
  const data = {
    name,
    price:    document.getElementById('m-price').value,
    description: document.getElementById('m-desc').value,
    link:     document.getElementById('m-link').value,
    person:   document.getElementById('m-person').value,
    priority: document.getElementById('m-priority').value,
    status:   document.getElementById('m-status').value,
    color:    colorEl?.dataset.colorId||'',
  };
  if (window._modalInvId) {
    await updateDoc(doc(db,'investments',window._modalInvId),{...data,updatedAt:serverTimestamp()});
    toast('Gespeichert ✓','success');
  } else {
    await addDoc(collection(db,'investments'),{...data,approvals:{user1:false,user2:false},comments:[],createdBy:getUserLabel(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
    toast('Investition hinzugefügt ✓','success');
  }
  document.getElementById('modal-overlay').classList.remove('open');
};

window.toggleApproval = async (id, key) => {
  const inv = (window._investments||[]).find(i=>i.id===id);
  if (!inv) return;
  // Jeder User darf nur seinen eigenen Key ändern
  const myKey = getMyApprovalKey();
  if (key !== myKey) {
    toast('Du kannst nur deine eigene Zustimmung ändern.', 'error');
    return;
  }
  const approvals = {...(inv.approvals||{user1:false,user2:false}),[key]:!inv.approvals?.[key]};
  const status = approvals.user1&&approvals.user2?'approved':inv.status==='approved'?'pending':inv.status;
  await updateDoc(doc(db,'investments',id),{approvals,status,updatedAt:serverTimestamp()});
  if (approvals.user1&&approvals.user2) toast('🎉 Beide zugestimmt – Freigegeben!','success');
};

// Gibt 'user1' oder 'user2' zurück basierend auf der Reihenfolge in Firebase Auth
// Wir speichern beim Login welcher Slot der User hat
function getMyApprovalKey() {
  return localStorage.getItem('myApprovalKey') || 'user1';
}

window.addInvComment = async invId => {
  const inp = document.getElementById('ici-'+invId);
  const text = inp.value.trim();
  if (!text) return;
  const inv = (window._investments||[]).find(i=>i.id===invId);
  if (!inv) return;
  const comments = [...(inv.comments||[]),{id:uid(),author:getUserLabel(),text,time:new Date().toLocaleString('de-CH')}];
  await updateDoc(doc(db,'investments',invId),{comments,updatedAt:serverTimestamp()});
  inp.value='';
};

window.deleteInv = id => {
  openConfirm('Investition löschen','Wirklich löschen?', async ()=>{
    await deleteDoc(doc(db,'investments',id));
    toast('Gelöscht');
  });
};

function renderInvestments() {
  const q = (document.getElementById('inv-search')?.value||'').toLowerCase();
  let list = [...(window._investments||[])];
  if (q) list=list.filter(i=>i.name.toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q));
  switch(currentInvFilter) {
    case 'pending':  list=list.filter(i=>i.status==='pending');  break;
    case 'approved': list=list.filter(i=>i.status==='approved'); break;
    case 'bought':   list=list.filter(i=>i.status==='bought');   break;
  }
  const container = document.getElementById('inv-grid');
  renderStats();
  if (!list.length) { container.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">💡</div><p>Keine Investitionen</p></div>`; return; }
  container.innerHTML = list.map(i=>invCardHTML(i)).join('');
}

function invCardHTML(inv) {
  const myKey = getMyApprovalKey();
  const chex = inv.color?colorHex(inv.color):'#9CA3AF';
  const statusMap = {pending:'status-pending',approved:'status-approved',rejected:'status-rejected',bought:'status-bought'};
  const statusLabel = {pending:'Ausstehend',approved:'Freigegeben',rejected:'Abgelehnt',bought:'Gekauft'};
  const a = inv.approvals||{user1:false,user2:false};
  const commentItems = (inv.comments||[]).map(c=>`<div class="comment-item"><div class="comment-author">${c.author}</div><div class="comment-text">${c.text}</div><div class="comment-time">${c.time}</div></div>`).join('');
  const colorSwatches = COLORS.map(c=>`<div class="color-swatch ${inv.color===c.id?'selected':''}" style="background:${c.hex}" title="${c.label}" onclick="updateInvField('${inv.id}','color','${c.id}')"></div>`).join('');
  return `
  <div class="inv-card" id="ic-${inv.id}">
    <div style="height:4px;background:${chex};border-radius:12px 12px 0 0"></div>
    <div class="inv-card-header" onclick="toggleInvExpand('${inv.id}')">
      <div style="flex:1">
        <div class="inv-name">${inv.name}</div>
        <div style="font-size:.78rem;color:var(--text3);margin-top:2px">
          ${inv.person?'👤 '+inv.person:''}
          ${inv.link?` · <a href="${inv.link}" target="_blank" onclick="event.stopPropagation()" style="font-size:.78rem">🔗 Link</a>`:''}
        </div>
      </div>
      <div style="text-align:right">
        ${inv.price?`<div class="inv-price">CHF ${parseFloat(inv.price).toLocaleString('de-CH',{minimumFractionDigits:2})}</div>`:''}
        <span class="inv-status-badge ${statusMap[inv.status]||'status-pending'}">${statusLabel[inv.status]||'Ausstehend'}</span>
      </div>
    </div>
    <div class="inv-approvals">
      <button class="approval-chip ${a.user1?'approved':''} ${myKey==='user1'?'my-approval':'other-approval'}" onclick="toggleApproval('${inv.id}','user1')">
        <span>${a.user1?'✓':'○'}</span> ${myKey==='user1'? 'Meine Zustimmung' : 'Zustimmung 2'}
      </button>
      <button class="approval-chip ${a.user2?'approved':''} ${myKey==='user2'?'my-approval':'other-approval'}" onclick="toggleApproval('${inv.id}','user2')">
        <span>${a.user2?'✓':'○'}</span> ${myKey==='user2'? 'Meine Zustimmung' : 'Zustimmung 1'}
      </button>
    </div>
    <div class="inv-detail" id="id-${inv.id}">
      <div class="detail-grid" style="margin-top:8px">
        <div class="field-group"><label>Name</label><input type="text" value="${(inv.name||'').replace(/"/g,'&quot;')}" onchange="updateInvField('${inv.id}','name',this.value)"></div>
        <div class="field-group"><label>Preis (CHF)</label><input type="number" value="${inv.price||''}" step="0.01" onchange="updateInvField('${inv.id}','price',this.value)"></div>
        <div class="field-group"><label>Zuständig</label><input type="text" value="${inv.person||''}" onchange="updateInvField('${inv.id}','person',this.value)"></div>
        <div class="field-group"><label>Status</label>
          <select onchange="updateInvField('${inv.id}','status',this.value)">
            <option value="pending"  ${inv.status==='pending'?'selected':''}>Ausstehend</option>
            <option value="approved" ${inv.status==='approved'?'selected':''}>Freigegeben</option>
            <option value="bought"   ${inv.status==='bought'?'selected':''}>Gekauft</option>
            <option value="rejected" ${inv.status==='rejected'?'selected':''}>Abgelehnt</option>
          </select></div>
        <div class="field-group"><label>Priorität</label>
          <select onchange="updateInvField('${inv.id}','priority',this.value)">
            <option value="low"    ${inv.priority==='low'?'selected':''}>Niedrig</option>
            <option value="medium" ${inv.priority==='medium'?'selected':''}>Mittel</option>
            <option value="high"   ${inv.priority==='high'?'selected':''}>Hoch</option>
          </select></div>
        <div class="field-group"><label>Produktlink</label><input type="url" value="${inv.link||''}" placeholder="https://..." onchange="updateInvField('${inv.id}','link',this.value)"></div>
        <div class="field-group" style="grid-column:1/-1"><label>Beschreibung</label><textarea onchange="updateInvField('${inv.id}','description',this.value)">${inv.description||''}</textarea></div>
        <div class="field-group" style="grid-column:1/-1"><label>Farbe</label><div class="color-picker">${colorSwatches}</div></div>
      </div>
      <div class="comments-section">
        <h4>Kommentare</h4>
        <div id="inv-comments-${inv.id}">${commentItems}</div>
        <div class="comment-add">
          <input type="text" id="ici-${inv.id}" placeholder="Kommentar..." onkeydown="if(event.key==='Enter')addInvComment('${inv.id}')">
          <button class="btn-save" onclick="addInvComment('${inv.id}')" style="padding:7px 12px">✉</button>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn-danger" onclick="deleteInv('${inv.id}')">🗑️ Löschen</button>
      </div>
    </div>
  </div>`;
}

window.toggleInvExpand = id => document.getElementById('ic-'+id)?.classList.toggle('expanded');

window.updateInvField = async (id, field, value) => {
  await updateDoc(doc(db,'investments',id),{[field]:value,updatedAt:serverTimestamp()});
};

// ── Notify ────────────────────────────────────────────────────────────
window.notifyChanges = () => {
  const todos = window._todos||[];
  const open  = todos.filter(t=>!t.done).length;
  const subj  = encodeURIComponent('Änderungen im Duo·Board');
  const body  = encodeURIComponent(`Hallo,\n\nEs gab Änderungen im gemeinsamen Duo·Board.\nBitte öffne die App und schau nach den aktuellen Aufgaben.\n\nOffene Aufgaben: ${open}\n\nViele Grüsse`);
  window.open(`mailto:?subject=${subj}&body=${body}`);
  toast('E-Mail-Client geöffnet');
};

// ── Export ────────────────────────────────────────────────────────────
window.exportCSV = type => {
  let rows, fname;
  if (type==='todos') {
    rows=[['Titel','Person','Fällig','Priorität','Status']];
    (window._todos||[]).forEach(t=>rows.push([t.title,t.person||'',t.dueDate||'',t.priority,t.done?'Erledigt':'Offen']));
    fname='aufgaben.csv';
  } else {
    rows=[['Name','Preis','Status','Priorität','Person']];
    (window._investments||[]).forEach(i=>rows.push([i.name,i.price||'',i.status,i.priority,i.person||'']));
    fname='investitionen.csv';
  }
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download=fname; a.click();
  toast('CSV exportiert ✓','success');
};

// ── Keypress helpers ──────────────────────────────────────────────────
window.loginKey = e => { if(e.key==='Enter') doLogin(); };

// Init empty arrays
window._todos = [];
window._investments = [];

// PWA Service Worker registrieren
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

</script>

<style>
:root {
  --bg: #F5F3EE; --bg2: #EDEAE3; --surface: #FFFFFF; --surface2: #F9F7F3;
  --border: #E0DBD2; --text: #1A1814; --text2: #6B6760; --text3: #9C9891;
  --accent: #2D5BE3; --accent-soft: #EBF0FC;
  --success: #22A86B; --warning: #E8913A; --danger: #D94040;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06); --shadow: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.12);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 18px;
  --tr: .18s cubic-bezier(.4,0,.2,1);
  --font-d: 'DM Serif Display',serif; --font: 'DM Sans',sans-serif;
}
[data-dark="true"] {
  --bg:#0F0E0C; --bg2:#1A1916; --surface:#201E1B; --surface2:#272420;
  --border:#33302B; --text:#F0EDE6; --text2:#9C9790; --text3:#5C5953;
  --accent-soft:#1A2650; --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow:0 4px 12px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--tr),color var(--tr)}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
input,textarea,select{font-family:var(--font)}
a{color:var(--accent)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── LOGIN ─────────────────────────── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--bg);
}
.login-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:40px 36px;
  width:100%;max-width:380px;box-shadow:var(--shadow-lg);
}
.login-brand{font-family:var(--font-d);font-size:2rem;text-align:center;margin-bottom:6px}
.login-brand .dot{color:var(--accent)}
.login-sub{text-align:center;color:var(--text3);font-size:.88rem;margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:.78rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.login-field input{
  width:100%;padding:10px 14px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface2);
  color:var(--text);font-size:.9rem;outline:none;
  transition:border-color var(--tr),box-shadow var(--tr);
}
.login-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.login-error{color:var(--danger);font-size:.82rem;margin-bottom:10px;min-height:18px;text-align:center}
.login-btn{
  width:100%;padding:11px;border-radius:var(--radius-sm);
  background:var(--accent);color:white;font-size:.92rem;font-weight:600;
  transition:all var(--tr);box-shadow:0 2px 8px rgba(45,91,227,.25);
}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}

/* ── APP SHELL ─────────────────────── */
#app-screen{display:flex;flex-direction:column;min-height:100vh}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:58px;
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);
}
.header-brand h1{font-family:var(--font-d);font-size:1.4rem;letter-spacing:-.02em}
.header-brand .dot{color:var(--accent)}
.header-nav{display:flex;gap:4px}
.nav-btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:.86rem;font-weight:500;color:var(--text2);transition:all var(--tr)}
.nav-btn:hover{background:var(--bg2);color:var(--text)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent)}
.header-right{display:flex;gap:8px;align-items:center}
.user-chip{font-size:.78rem;color:var(--text3);padding:4px 10px;background:var(--bg2);border-radius:20px}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:1rem;transition:all var(--tr)}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.btn-notify{padding:7px 13px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:.8rem;font-weight:500;transition:all var(--tr)}
.btn-notify:hover{border-color:var(--accent);color:var(--accent)}

/* ── MAIN ──────────────────────────── */
.main{flex:1;padding:24px;max-width:1200px;margin:0 auto;width:100%}
.page{display:none}.page.active{display:block}
.section-title{font-family:var(--font-d);font-size:1.55rem;color:var(--text);margin-bottom:20px;letter-spacing:-.02em}
.section-subtitle{color:var(--text2);font-size:.86rem;margin-top:2px;font-style:italic}

/* ── TOOLBAR ───────────────────────── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;flex:1;min-width:180px;transition:border-color var(--tr),box-shadow var(--tr)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-box input{border:none;background:none;padding:8px 0;font-size:.87rem;color:var(--text);outline:none;flex:1}
.search-box input::placeholder{color:var(--text3)}
.filter-group{display:flex;gap:4px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;border-radius:20px;font-size:.78rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all var(--tr)}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:white}
.btn-primary{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);background:var(--accent);color:white;font-size:.86rem;font-weight:600;transition:all var(--tr);box-shadow:0 2px 8px rgba(45,91,227,.25)}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--radius-sm);background:var(--surface);color:var(--text2);font-size:.86rem;font-weight:500;border:1px solid var(--border);transition:all var(--tr)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

/* ── STATS ─────────────────────────── */
.stats-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.stat-chip{padding:7px 14px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);font-size:.8rem;font-weight:500;color:var(--text2)}
.stat-chip strong{color:var(--text);font-weight:700}
.stat-chip.accent{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ── QUICK ADD ─────────────────────── */
.quick-add{display:flex;gap:10px;margin-bottom:18px}
.quick-add input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:.88rem;outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
.quick-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.quick-add input::placeholder{color:var(--text3)}

/* ── TASK CARDS ────────────────────── */
.tasks-list{display:flex;flex-direction:column;gap:7px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all var(--tr);box-shadow:var(--shadow-sm);position:relative}
.task-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.task-card.dragging{opacity:.45;transform:scale(.98)}
.task-card.drag-over{border-color:var(--accent)}
.task-card.done .task-header{opacity:.55}
.overdue-h{background:linear-gradient(135deg,var(--surface) 0%,#FFF5F5 100%)}
[data-dark="true"] .overdue-h{background:linear-gradient(135deg,var(--surface) 0%,#1f1010 100%)}
.color-strip{position:absolute;left:0;top:0;bottom:0;width:4px}
.task-header{display:flex;align-items:center;gap:10px;padding:13px 14px 13px 20px;cursor:pointer}
.drag-handle{color:var(--text3);font-size:.85rem;cursor:grab;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.done-btn{width:21px;height:21px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--tr);font-size:.68rem;color:transparent}
.done-btn:hover{border-color:var(--success);color:var(--success)}
.done-btn.done{background:var(--success);border-color:var(--success);color:white}
.task-title{flex:1;font-size:.9rem;font-weight:500;color:var(--text)}
.task-card.done .task-title{text-decoration:line-through;color:var(--text3)}
.task-meta{display:flex;align-items:center;gap:7px;flex-shrink:0}
.task-badge{padding:2px 7px;border-radius:10px;font-size:.72rem;font-weight:600}
.badge-overdue{background:#FEE2E2;color:var(--danger)}
.badge-soon{background:#FEF3C7;color:#B45309}
.badge-person{background:var(--bg2);color:var(--text2)}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.p-high{background:var(--danger)}.p-medium{background:var(--warning)}.p-low{background:var(--success)}
.expand-icon{color:var(--text3);font-size:.72rem;transition:transform var(--tr)}
.task-card.expanded .expand-icon{transform:rotate(90deg)}
.progress-bar{height:3px;background:var(--bg2);border-radius:2px}
.progress-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s ease}

/* ── TASK DETAIL ───────────────────── */
.task-detail{display:none;padding:0 16px 14px 16px;border-top:1px solid var(--border);animation:slideDown .16s ease}
.task-card.expanded .task-detail{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-group label{font-size:.74rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.field-group input,.field-group select,.field-group textarea{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:.86rem;outline:none;transition:border-color var(--tr)}
.field-group input:focus,.field-group select:focus,.field-group textarea:focus{border-color:var(--accent)}
.field-group textarea{resize:vertical;min-height:65px}
.color-picker{display:flex;gap:6px;flex-wrap:wrap}
.color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform var(--tr),border-color var(--tr)}
.color-swatch:hover{transform:scale(1.2)}
.color-swatch.selected{border-color:var(--text);transform:scale(1.1)}
.subtasks-section{margin-top:10px}
.subtasks-section h4,.comments-section h4{font-size:.76rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.subtask-item{display:flex;align-items:center;gap:7px;padding:4px 0}
.subtask-item input[type="checkbox"]{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0}
.subtask-item input[type="text"]{flex:1;border:none;background:none;color:var(--text);font-size:.86rem;outline:none;padding:2px;border-bottom:1px solid transparent;transition:border-color var(--tr)}
.subtask-item input[type="text"]:focus{border-bottom-color:var(--accent)}
.subtask-item.done-sub input[type="text"]{text-decoration:line-through;color:var(--text3)}
.subtask-add{display:flex;gap:6px;margin-top:6px}
.subtask-add input{flex:1;padding:5px 9px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:.83rem;outline:none}
.comments-section{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.comment-item{padding:7px 9px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:5px}
.comment-author{font-size:.73rem;font-weight:600;color:var(--accent);margin-bottom:2px}
.comment-text{font-size:.83rem;color:var(--text)}
.comment-time{font-size:.7rem;color:var(--text3);margin-top:2px}
.comment-add{display:flex;gap:6px;margin-top:6px}
.comment-add input{flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:.83rem;outline:none}
.changelog{margin-top:8px;font-size:.76rem;color:var(--text3)}
.changelog span{display:block;padding:1px 0}
.detail-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn-danger{padding:6px 13px;border-radius:var(--radius-sm);background:#FEE2E2;color:var(--danger);font-size:.83rem;font-weight:500;transition:all var(--tr)}
.btn-danger:hover{background:var(--danger);color:white}
.btn-save{padding:7px 14px;border-radius:var(--radius-sm);background:var(--accent);color:white;font-size:.83rem;font-weight:600;transition:all var(--tr)}
.btn-save:hover{opacity:.9}

/* ── INVESTMENTS ───────────────────── */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.inv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:all var(--tr)}
.inv-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.inv-card-header{display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer}
.inv-name{font-weight:600;font-size:.93rem;color:var(--text)}
.inv-price{font-size:.97rem;font-weight:700;color:var(--text);font-family:var(--font-d)}
.inv-status-badge{padding:3px 8px;border-radius:10px;font-size:.71rem;font-weight:600}
.status-pending{background:#FEF3C7;color:#B45309}.status-approved{background:#D1FAE5;color:#065F46}
.status-rejected{background:#FEE2E2;color:var(--danger)}.status-bought{background:var(--accent-soft);color:var(--accent)}
.inv-approvals{display:flex;gap:7px;padding:0 14px 10px 14px}
.approval-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);font-size:.76rem;font-weight:500;cursor:pointer;transition:all var(--tr);background:var(--surface2)}
.approval-chip:hover{border-color:var(--success)}
.approval-chip.approved{background:#D1FAE5;border-color:var(--success);color:#065F46}
.approval-chip.other-approval{opacity:.6;cursor:not-allowed}
.approval-chip.other-approval:hover{border-color:var(--border)}
.inv-detail{display:none;padding:0 14px 14px 14px;border-top:1px solid var(--border);animation:slideDown .16s ease}
.inv-card.expanded .inv-detail{display:block}

/* ── MODAL ─────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;width:100%;max-width:460px;margin:20px;box-shadow:var(--shadow-lg);transform:translateY(10px);transition:transform var(--tr);max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h2{font-family:var(--font-d);font-size:1.35rem;margin-bottom:14px}
.modal .field-group{margin-bottom:10px}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}

/* ── CONFIRM ───────────────────────── */
.cf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:250;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.cf-overlay.open{opacity:1;pointer-events:all}
.cf-box{background:var(--surface);border-radius:var(--radius-lg);padding:26px;max-width:340px;width:calc(100% - 40px);box-shadow:var(--shadow-lg)}
.cf-box h3{font-family:var(--font-d);font-size:1.15rem;margin-bottom:7px}
.cf-box p{font-size:.86rem;color:var(--text2);margin-bottom:18px}
.cf-actions{display:flex;gap:10px;justify-content:flex-end}

/* ── TOAST ─────────────────────────── */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:7px}
.toast{padding:11px 16px;border-radius:var(--radius-sm);background:var(--text);color:var(--bg);font-size:.86rem;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .22s ease,toastOut .22s ease 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;pointer-events:none}}

/* ── EMPTY ─────────────────────────── */
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.big-icon{font-size:2.8rem;margin-bottom:10px;opacity:.35}

/* ── RESPONSIVE ────────────────────── */
@media(max-width:768px){
  .main{padding:14px}
  .header{padding:0 14px}
  .header-brand h1{font-size:1.2rem}
  .user-chip{display:none}
  .btn-notify{display:none}
  .inv-grid{grid-template-columns:1fr}
  .nav-btn{padding:5px 10px;font-size:.8rem}
}
</style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══════════════════════════════════════════════════ -->
<div id="login-screen" style="display:flex">
  <div class="login-card">
    <div class="login-brand">Duo<span class="dot">·</span>Board</div>
    <div class="login-sub">Gemeinsames Aufgaben- & Investitions-Board</div>
    <div class="login-field">
      <label>E-Mail</label>
      <input type="email" id="l-email" placeholder="deine@email.com" onkeydown="loginKey(event)" autocomplete="email">
    </div>
    <div class="login-field">
      <label>Passwort</label>
      <input type="password" id="l-pass" placeholder="••••••••" onkeydown="loginKey(event)" autocomplete="current-password">
    </div>
    <div class="login-error" id="l-error"></div>
    <button class="login-btn" id="l-btn" onclick="doLogin()">Anmelden</button>
  </div>
</div>

<!-- ══ APP SCREEN ════════════════════════════════════════════════════ -->
<div id="app-screen" style="display:none">

  <!-- Header -->
  <header class="header">
    <div class="header-brand"><h1>Duo<span class="dot">·</span>Board</h1></div>
    <nav class="header-nav">
      <button class="nav-btn active" onclick="showPage('todos')" id="nav-todos">📋 Aufgaben</button>
      <button class="nav-btn" onclick="showPage('investments')" id="nav-investments">💡 Investitionen</button>
    </nav>
    <div class="header-right">
      <span class="user-chip" id="user-label"></span>
      <button class="btn-notify" onclick="notifyChanges()">✉️ Meldung senden</button>
      <button class="icon-btn" onclick="toggleDark()" title="Dark Mode" id="dark-icon">🌙</button>
      <button class="icon-btn" onclick="doLogout()" title="Abmelden">🚪</button>
    </div>
  </header>

  <main class="main">

    <!-- ── TODOS PAGE ─────────────────────────────────────────── -->
    <div class="page active" id="page-todos">
      <div class="section-title">Aufgaben<div class="section-subtitle">Gemeinsames Board — Änderungen sofort sichtbar</div></div>
      <div class="stats-bar" id="todo-stats"></div>
      <div class="toolbar">
        <div class="search-box">
          <span style="color:var(--text3)">🔍</span>
          <input type="text" placeholder="Aufgaben suchen..." id="todo-search" oninput="renderTodos()">
        </div>
        <div class="filter-group" id="todo-filters">
          <button class="filter-btn active" onclick="setFilter('open',this)">Offen</button>
          <button class="filter-btn" onclick="setFilter('done',this)">Erledigt</button>
          <button class="filter-btn" onclick="setFilter('overdue',this)">Überfällig</button>
          <button class="filter-btn" onclick="setFilter('newest',this)">Neueste</button>
          <button class="filter-btn" onclick="setFilter('duedate',this)">Nach Datum</button>
          <button class="filter-btn" onclick="setFilter('priority',this)">Priorität</button>
        </div>
        <button class="btn-secondary" onclick="exportCSV('todos')" style="padding:7px 12px;font-size:.8rem">⬇️ CSV</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap" id="person-filters"></div>
      <div class="quick-add">
        <input type="text" id="qa-input" placeholder="+ Neue Aufgabe eingeben und Enter drücken..." onkeydown="if(event.key==='Enter')quickAdd()">
        <button class="btn-primary" onclick="quickAdd()">＋ Hinzufügen</button>
      </div>
      <div class="tasks-list" id="tasks-list"></div>
    </div>

    <!-- ── INVESTMENTS PAGE ───────────────────────────────────── -->
    <div class="page" id="page-investments">
      <div class="section-title">Investitionen<div class="section-subtitle">Anschaffungen planen und freigeben</div></div>
      <div class="stats-bar" id="inv-stats"></div>
      <div class="toolbar">
        <div class="search-box">
          <span style="color:var(--text3)">🔍</span>
          <input type="text" placeholder="Investitionen suchen..." id="inv-search" oninput="renderInvestments()">
        </div>
        <div class="filter-group" id="inv-filters">
          <button class="filter-btn active" onclick="setInvFilter('all',this)">Alle</button>
          <button class="filter-btn" onclick="setInvFilter('pending',this)">Ausstehend</button>
          <button class="filter-btn" onclick="setInvFilter('approved',this)">Freigegeben</button>
          <button class="filter-btn" onclick="setInvFilter('bought',this)">Gekauft</button>
        </div>
        <button class="btn-primary" onclick="openAddInv()">＋ Neue Investition</button>
        <button class="btn-secondary" onclick="exportCSV('investments')" style="padding:7px 12px;font-size:.8rem">⬇️ CSV</button>
      </div>
      <div class="inv-grid" id="inv-grid"></div>
    </div>

  </main>
</div>

<!-- ══ INVESTMENT MODAL ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <h2 id="modal-title">Neue Investition</h2>
    <div class="field-group"><label>Produktname *</label><input type="text" id="m-name" placeholder="z.B. MacBook Pro"></div>
    <div class="field-group"><label>Preis (CHF)</label><input type="number" id="m-price" placeholder="0.00" step="0.01"></div>
    <div class="field-group"><label>Beschreibung</label><textarea id="m-desc" placeholder="Details und Bemerkungen..."></textarea></div>
    <div class="field-group"><label>Produktlink</label><input type="url" id="m-link" placeholder="https://..."></div>
    <div class="field-group"><label>Zuständige Person</label><input type="text" id="m-person" placeholder="Name eingeben"></div>
    <div class="field-group"><label>Priorität</label>
      <select id="m-priority">
        <option value="medium">Mittel</option><option value="high">Hoch</option><option value="low">Niedrig</option>
      </select></div>
    <div class="field-group"><label>Status</label>
      <select id="m-status">
        <option value="pending">Ausstehend</option><option value="approved">Freigegeben</option>
        <option value="bought">Gekauft</option><option value="rejected">Abgelehnt</option>
      </select></div>
    <div class="field-group"><label>Farbe</label><div class="color-picker" id="m-color"></div></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Abbrechen</button>
      <button class="btn-save" onclick="saveInvestment()">Speichern</button>
    </div>
  </div>
</div>

<!-- ══ CONFIRM ═══════════════════════════════════════════════════════ -->
<div class="cf-overlay" id="cf-overlay">
  <div class="cf-box">
    <h3 id="cf-title">Bestätigen</h3>
    <p id="cf-msg">Möchten Sie wirklich fortfahren?</p>
    <div class="cf-actions">
      <button class="btn-secondary" onclick="closeConfirm()">Abbrechen</button>
      <button class="btn-danger" onclick="doConfirm()">Löschen</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ══════════════════════════════════════════════════════════ -->
<div class="toast-wrap" id="toast-wrap"></div>

</body>
</html>
